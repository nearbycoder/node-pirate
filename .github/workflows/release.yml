name: Publish npm release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require a version-matching tag on master
        shell: bash
        run: |
          node -e '
            const packageJson = require("./package.json");
            const expected = `v${packageJson.version}`;
            if (process.env.GITHUB_REF_NAME !== expected) {
              console.error(`Expected release tag ${expected}, received ${process.env.GITHUB_REF_NAME}`);
              process.exit(1);
            }
          '
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install the locked dependency tree
        run: npm ci --ignore-scripts

      - name: Verify the npm toolchain
        run: test "$(npm --version)" = "11.16.0"

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit known vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Typecheck, test, and build
        run: bun run check

      - name: Verify the npm package allowlist
        shell: bash
        run: |
          npm pack --dry-run --json --ignore-scripts > /tmp/node-pirate-pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("/tmp/node-pirate-pack.json", "utf8"))[0];
            const actual = report.files.map(({ path }) => path).sort();
            const expected = ["Readme.md", "dist/node-pirate.js", "package.json"].sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              console.error("Unexpected npm package contents:", actual);
              process.exit(1);
            }
          '

      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public
